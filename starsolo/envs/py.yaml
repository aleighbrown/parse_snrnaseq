name: starsolo_py
# nodefaults: keep Anaconda's `defaults` channel (added by the cluster's
# condarc) out of the solve. No dnaio/isal: their compiled compression
# libraries would not install on the cluster, so FASTQ I/O is plain Python
# over pigz (scripts/fastq_io.py).
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12
  - pandas>=2.0
  - numpy
  - pigz
