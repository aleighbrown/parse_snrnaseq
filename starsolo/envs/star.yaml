name: star
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  # Pinned exactly: the reference directory name carries this version.
  - star=2.7.11b
  # Only indexes BAMs, so the version doesn't matter. Unpinned because every
  # samtools 1.21 build needs a newer glibc than the cluster offers.
  - samtools>=1.18
  # choose_strand.py runs inside this env
  - python=3.12
