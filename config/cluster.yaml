# Per-rule SGE resources for the UCL CS cluster, consumed by submit.sh via
# --cluster-config as {cluster.tmem}, {cluster.h_vmem}, {cluster.h_rt} and
# {cluster.submission_string}.
#
# IMPORTANT: tmem and h_vmem are PER SLOT. A rule asking for "-pe smp 16" with
# tmem 4G reserves 16 x 4G = 64G total. Keep the smp count in submission_string
# in step with `threads:` in config/config.yaml (currently 16) -- if they drift,
# split-pipe will either be throttled or the job will be killed for overrunning
# its memory reservation.
#
# tscratch (local scratch) is PER SLOT too, and is set here per rule -- it used
# to be a flat 50G in cluster_qsub.sh, which on a 4-slot job asked for 200G,
# more than any node has (`qhost -F tscratch`: max ~190G, most 160G), so those
# jobs queued behind the one node that could ever run them. split-pipe needs
# the big scratch; nothing else does.
#
# CEILING: the largest tmem on any node is 125G (`qhost -F tmem`), so
# slots x tmem must stay under that or the job can never be scheduled.
#
# h_rt values are QUOTED on purpose: YAML 1.1 reads a bare 72:00:00 as
# sexagesimal and hands qsub 259200. SGE accepts that as seconds so it happens
# to work, but the quoted form is what you actually meant.

__default__:
    h_vmem: 4G
    tmem:   4G
    h_rt:   "4:00:00"
    tscratch: 1G
    submission_string: " "

# --- Stage 0: reference -------------------------------------------------------
# gunzip of the GENCODE GTF into the shared _sources tree. Single-threaded.
stage_genome_file:
    h_vmem: 8G
    tmem:   8G
    h_rt:   "4:00:00"
    submission_string: " "

# The big one: STAR index build over GRCh38. 16 x 4G = 64G.
mkref:
    h_vmem: 16G
    tmem:   16G
    h_rt:   "24:00:00"
    submission_string: "-pe smp 4 -R y"
    tscratch: 50G

# --- Stage 1: split-pipe ------------------------------------------------------
# Used when splitpipe.split_steps is TRUE: each sublibrary becomes three jobs.
# Sizing comes from ParseFANS1's process/mem_profile.txt (1.69e9 reads at 4
# threads) -- see the header of workflow/rules/parse.smk. Peak RSS measured was
# pre 11.3G, align 17.9G, post-onward 4.3G, so the old flat 64G was ~3.6x more
# memory than any step actually touched.
#
# WALLTIMES: ParseFANS1 is the 3rd SMALLEST of the 16 sublibraries (102 GB of
# FASTQ against a 122 GB mean and ParseFANS11's 196 GB). Everything below is
# sized for the 1.92x worst case, plus slack for I/O contention when all 16
# run concurrently -- ParseFANS1's timings alone would be far too tight.

# inqc + pre. 5.73 h at 4 threads on the smallest sublibrary. 8 x 4G = 32G.
split_pipe_pre:
    h_vmem: 8G
    tmem:   8G
    h_rt:   "24:00:00"
    submission_string: "-pe smp 4 -R y"
    tscratch: 50G

# align. STAR, and the only step that saturates its cores (3.87 of 4). 9.71 h
# at 4 threads, so expect ~5 h at 8. 8 slots rather than 16 on purpose: with 16,
# running several sublibraries at once needs hundreds of slots and the jobs sit
# in the queue instead of running -- 8 is usually the shorter path to a finished
# run on a busy shared cluster. The walltime assumes it might NOT scale at all,
# covering 9.71 x 1.92 = 18.6 h either way. 8 x 6G = 48G, ~2.7x the 17.9G peak.
split_pipe_align:
    h_vmem: 6G
    tmem:   6G
    h_rt:   "48:00:00"
    submission_string: "-pe smp 8 -R y"
    tscratch: 50G

# post -> clean (PostProcess, Molinfo, DGE, SubSample, Analysis, Report, Clean).
# I/O-bound at 1.2-1.9 cores, so it stays at 4 slots. Memory stays at 16G/slot
# because DGE has NOT been profiled yet -- it builds the cell x gene matrices
# and is the likeliest true peak. Trim it once one full run reports back.
split_pipe_post:
    h_vmem: 16G
    tmem:   16G
    h_rt:   "72:00:00"
    submission_string: "-pe smp 4 -R y"
    tscratch: 50G

# Used only when splitpipe.split_steps is FALSE (one --mode all job per
# sublibrary). Raised from 72h: ParseFANS1 was still mid-run at 19.8 h having
# reached only step 5 of 10, projecting to ~28 h -- so the largest sublibrary
# lands near 55 h, which is too close to a 72 h ceiling to be safe.
split_pipe:
    h_vmem: 16G
    tmem:   16G
    h_rt:   "120:00:00"
    submission_string: "-pe smp 4 -R y"
    tscratch: 50G

# Merges all 16 sublibraries into one DGE matrix -- memory-bound, not CPU-bound.
# 8 x 8G = 64G.
split_pipe_comb:
    h_vmem: 64G
    tmem:   64G
    h_rt:   "15:00:00"
    submission_string: " "
    tscratch: 50G

barcodes_from_meta:
    h_vmem: 4G
    tmem:   4G
    h_rt:   "1:00:00"
    submission_string: " "

index_bam:
    h_vmem: 8G
    tmem:   8G
    h_rt:   "4:00:00"
    submission_string: " "

# --- Stage 2: demux (only reachable once VCFs exist) --------------------------
prepare_reference_vcf:
    h_vmem: 4G
    tmem:   4G
    h_rt:   "12:00:00"
    submission_string: "-pe smp 4 -R y"

# Pileup over every cell at the panel SNP sites. 8 x 4G = 32G.
cellsnp:
    h_vmem: 4G
    tmem:   4G
    h_rt:   "24:00:00"
    submission_string: "-pe smp 8 -R y"

vireo:
    h_vmem: 8G
    tmem:   8G
    h_rt:   "12:00:00"
    submission_string: "-pe smp 4 -R y"

# --- Stage 3: aggregate -------------------------------------------------------
# Both read the whole per-cell table into pandas (the provided table is 63 MB /
# 250k rows), so give them headroom.
aggregate_assignments:
    h_vmem: 16G
    tmem:   16G
    h_rt:   "2:00:00"
    submission_string: " "

import_assignments:
    h_vmem: 16G
    tmem:   16G
    h_rt:   "2:00:00"
    submission_string: " "

# --- Stage 4: cell type annotation --------------------------------------------
# Three stages (workflow/rules/celltype.smk). The slow, light, independent
# part (doublets) runs as 16 narrow jobs that start quickly; the one large
# reservation (cluster) is held for a few hours. Figures below are estimates
# scaled up from the 20k-cell test (36 min, 5.1 GB R heap, 60% of it in
# scDblFinder) -- each stage logs its heap per step and its peak; trim from
# those after the first full run. Slots must equal threads: in config.yaml.

# mtx -> QC -> per-sublibrary counts. ~30 GB heap peak, plus fread's map of the
# 16 GB file, which counts against h_vmem. 2 x 32G = 64G: this stage mostly
# reads one file, so 2 slots place more easily than 4 and lose little.
celltype_prep:
    h_vmem: 32G
    tmem:   32G
    h_rt:   "4:00:00"
    tscratch: 5G
    submission_string: "-pe smp 2 -R y"

# 20k cells; the awk subset read is most of it. 2 x 8G = 16G.
celltype_prep_test:
    h_vmem: 8G
    tmem:   8G
    h_rt:   "1:00:00"
    tscratch: 5G
    submission_string: "-pe smp 2 -R y"

# scDblFinder on one sublibrary (~26k cells). Shared by the full run and the
# test. Guess: 1-3 h at 2 threads; a few GB. 2 x 8G = 16G.
celltype_doublets:
    h_vmem: 8G
    tmem:   8G
    h_rt:   "8:00:00"
    tscratch: 5G
    submission_string: "-pe smp 2 -R y"

# Seurat / Harmony / Azimuth over all clustered cells. Guess: 50-80 GB in the
# main process plus ~10 GB per Azimuth worker (celltype.azimuth.workers: 2),
# 3-5 h. 4 x 30G = 120G, the most that fits under the 125G host ceiling -- if
# the log's peak comes out near that, drop azimuth.workers to 1 rather than
# asking for more.
celltype_cluster:
    h_vmem: 30G
    tmem:   30G
    h_rt:   "12:00:00"
    tscratch: 5G
    submission_string: "-pe smp 4 -R y"

# ~17k cells: ~10 min in the test. 2 x 8G = 16G.
celltype_cluster_test:
    h_vmem: 8G
    tmem:   8G
    h_rt:   "1:00:00"
    tscratch: 5G
    submission_string: "-pe smp 2 -R y"
