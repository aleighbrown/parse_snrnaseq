# =============================================================================
# Gatt FTLD-TDP FANS — Parse WT Evercode (Mega kit, 16 sublibraries)
#
# Stage 0  reference   FASTA + GTF -> `split-pipe --mode mkref`
# Stage 1  split-pipe  per-sublibrary `--mode all`, then `--mode comb`
# Stage 2  demux       cellsnp-lite -> vireo   OR   import existing assignments
# Stage 3  aggregate   one assignment table + summary across all sublibraries
#
# Project dir on the cluster (run snakemake from here):
#   /SAN/neuroscience/direct_nanopore_rna/ariana_parse
# All relative paths below are relative to that working directory.
# =============================================================================

# --- Conda environments -------------------------------------------------------
# split-pipe is Parse's proprietary binary and has no conda recipe, but it is
# already installed in an environment. Snakemake's `conda:` directive accepts
# the PATH TO AN EXISTING ENVIRONMENT, so the rules that call split-pipe point
# straight at it -- nothing is solved, built or cached, and --conda-prefix does
# not apply to it. Rules with a real recipe still use workflow/envs/*.yaml.
conda_envs:
  spipe: /SAN/vyplab/FUS_RNA/conda_envs/spipe    # split-pipe v1.9.0
  # (The celltype rules use a Singularity image instead -- see celltype.container.)

# --- Stage 0: genome reference -----------------------------------------------
genome:
  # Where the built split-pipe reference lives. This is a SHARED LAB RESOURCE:
  # built once here, reusable by any project that needs a Parse human reference.
  # Follows the existing <type>/<species>/ convention of that tree.
  ref_root: /SAN/vyplab/vyplab_reference_genomes/parse_ref/human
  #   -> <ref_root>/GRCh38_gencode_v42/            the reference
  #      <ref_root>/GRCh38_gencode_v42.mkref.done  provenance stamp
  #      <ref_root>/_sources/                      decompressed FASTA/GTF
  # Set to null to build into the project's own resources/genomes/ instead.

  # Point at an existing split-pipe reference to skip building entirely. Set
  # this in downstream projects once the shared reference above exists.
  prebuilt_dir: null

  # One entry per species; two or more entries build a single mixed-species
  # reference. Give each file as a local path (`fasta:` / `gtf:`) or a URL to
  # download (`fasta_url:` / `gtf_url:`).
  #
  # An uncompressed local file is read where it lies. A .gz is decompressed once
  # into <ref_root>/_sources/ because mkref needs plain text. Every input is
  # wrapped in ancient(), so once the reference exists no source timestamp can
  # trigger a rebuild -- delete the directory to force one.
  #
  # NAMING: split-pipe rejects underscores in --genome_name and silently
  # rewrites them (GRCh38_gencode_v42 -> GRCh38-gencode-v42). The name here is
  # already in its preferred form so the directory matches the reference's
  # internal run_name.
  #
  # CONTIGS: split-pipe prefixes every chromosome with the genome name
  # ("mkref_chr_geno_prefix"), so this reference's contigs are
  # GRCh38-gencode-v42_chr1, NOT chr1 -- and BAMs aligned to it will be too.
  # Anything matching on contig name downstream (donor VCFs for the vireo
  # branch, regtools for junctions, IGV) has to account for that prefix.
  assemblies:
    - name: GRCh38-gencode-v42
      fasta: /SAN/vyplab/vyplab_reference_genomes/sequence/human/gencode/GRCh38.primary_assembly.genome.fa
      gtf: /SAN/vyplab/vyplab_reference_genomes/annotation/human/GRCh38/gencode.v42.annotation.sorted.gtf.gz
      # fasta_url: https://ftp.ensembl.org/pub/release-114/fasta/homo_sapiens/dna/Homo_sapiens.GRCh38.dna.primary_assembly.fa.gz
      # gtf_url:   https://ftp.ensembl.org/pub/release-114/gtf/homo_sapiens/Homo_sapiens.GRCh38.114.gtf.gz

  # Extra flags passed verbatim to `split-pipe --mode mkref` (e.g. --sparse).
  mkref_extra: ""
  # A human reference needs a lot of RAM and time; tune for your scheduler.
  # Measured on GRCh38 + GENCODE v42: 1h15m wall, 26 GB peak RSS, cpu_eff 0.08
  # at 16 threads. cluster.yaml currently reserves 4 x 16G = 64G, so there is
  # room to trim if mkref ever queues badly.
  mkref_mem_mb: 64000
  mkref_runtime: 480        # minutes

# --- Where output goes --------------------------------------------------------
# All pipeline results. Deliberately outside the git repo. logs/ and
# submissions/ stay next to the workflow, in the project dir you run from.
results_dir: /SAN/neuroscience/direct_nanopore_rna/ariana_parse/spipe_jh_donor_annotations

# --- Stage 1: sublibraries / FASTQ -------------------------------------------
# fq1/fq2 in sublibraries.tsv are relative to this (absolute paths used as-is).
fastq_dir: /SAN/neuroscience/direct_nanopore_rna/ariana_parse/00_fastq
sublibraries: config/sublibraries.tsv
# Which sublibrary the `test_sublib` smoke-test target runs on.
test_sublibrary: ParseFANS1

splitpipe:
  # REQUIRED. split-pipe v1.9.0 does not auto-detect this for --mode all -- with
  # no --chemistry it exits immediately with "Problem: No chemistry set".
  # v3 confirmed for this run (Evercode WT Mega, Gatt FANS sorts).
  chemistry: v3
  # REQUIRED, same as chemistry: split-pipe exits with "Kit must be specified".
  # List the values your build accepts with `split-pipe --kit_list`.
  # WT_mega = 96 samples, plate (8,12), chemistry v1-v4. The 8x12 round-1 plate
  # is what config/parse_sample_list.txt's A1-D7 / D8-H2 / H3-H12 ranges assume.
  kit: WT_mega
  # Round-1 well -> FANS sort map. Same file for every sublibrary.
  sample_list: config/parse_sample_list.txt
  # Paths RELATIVE to each sublibrary's split-pipe output dir.
  bam_name: process/barcode_headAligned_anno.bam
  # NOT all-well. With samples given via --samp_list and make_allwell False
  # (the default), split-pipe never creates an 'all-well' sample -- spc_setup.py
  # only adds one when no samples were given or --yes_allwell is passed. This
  # run set up 4 samples: K_negative, TDP_negative, positive, all-sample.
  # 'all-sample' covers all 96 wells, so it is the equivalent file; pointing at
  # all-well would leave this rule's declared output permanently missing, and
  # snakemake would fail the job and delete its outputs after ~28 h of work.
  cell_meta: all-sample/DGE_filtered/cell_metadata.csv
  # Column in cell_meta holding the barcode string that matches the BAM tag.
  # The collaborator's barcodes look like "01_01_67__sParseFANS1", i.e.
  # <bc_wells>__s<sublibrary>, so bc_wells is the per-sublibrary form.
  barcode_column: bc_wells
  # Extra flags passed to EVERY split-pipe step invocation
  # (e.g. --parfile, --kit_score_skip).
  all_extra: ""
  # true  -> submit each sublibrary as three right-sized jobs:
  #            split_pipe_pre    inqc + pre     (thread-hungry)
  #            split_pipe_align  align only     (STAR; the CPU-bound step)
  #            split_pipe_post   post -> clean  (I/O-bound, runs narrow)
  # false -> one `--mode all` job per sublibrary, as before.
  # See workflow/rules/parse.smk for the measurements behind the split.
  split_steps: true

# --- Stage 2: demultiplexing -------------------------------------------------
demux:
  # "vireo"    run cellsnp-lite + vireo against the genotype panel
  # "provided" skip both and import an existing per-barcode assignment table
  mode: provided

  provided:
    # The collaborator's demuxalot+vireo result and the ONLY donor information
    # available here: 250,219 barcodes, 34 donors (31 with pathology-number
    # identities + 3 Vireo virtual donors that were never matched).
    table: /SAN/neuroscience/direct_nanopore_rna/ariana_parse/resources/gatt_donor_adjust_barcode_annotations.tsv
    # Column holding "<bc_wells>__s<sublibrary>"; split on "__s" to recover both.
    barcode_column: barcode
    donor_column: donor
    sublibrary_column: sublib.x
    # Extra columns carried through to the output table, if present.
    keep_columns:
      - dmux_type          # SNG / DBL from demuxalot
      - demux_group        # high_conf_donor / only_demuxalot / likely_missing_donor
      - vireo_donor
      - same_donor
      - condition          # FANS sort, from the Round-1 barcode
      - cell_type
      - cluster_label
      - n_genes
      - n_counts
      - percent_mito
    # 49,648 of the 250,219 rows are dmux_type == DBL / "likely_missing_donor".
    # These are NOT doublets: they are exactly the three Vireo virtual donors
    # (donor3 18,602 + donor33 18,088 + donor30 12,958 = 49,648), i.e. cells
    # demuxalot called doublet because their true donor had no genotype in the
    # panel. Dropping them would delete three entire donors, so: keep them.
    drop_doublets: false

# --- Donor metadata (optional) -----------------------------------------------
# Joined onto the per-cell table on donor_id. Derived from the assignment table
# itself; nygc_id / path_diag / mutation are yours to fill in. Set to null to
# skip the join entirely.
donor_metadata: config/donor_metadata.tsv

# --- Genotype panel (ONLY used when demux.mode == "vireo") -------------------
# NO VCFs ARE AVAILABLE FOR THIS COHORT. Both keys below are null, so the vireo
# branch is unavailable: setting demux.mode: vireo fails immediately with an
# explanatory error rather than part-way through the run.
#
# To enable it you need EITHER:
#   donor_vcfs:    a TSV with columns donor_id, vcf (one bgzipped+indexed VCF
#                  per donor; they get merged into reference_vcf), OR
#   reference_vcf: one joint-genotyped multi-sample VCF, with
#                  build_reference_vcf: false
# The donor_id values must match the sample names inside the VCFs
# (`bcftools query -l`); reheader with `bcftools reheader -s` if not.
donor_vcfs: null
reference_vcf: null
build_reference_vcf: false

# BAM tag names, for the vireo branch. VERIFY on one real BAM before scaling:
#   samtools view <bam> | head -1
# If reads carry no UMI tag, set umi_tag: "None" (cellsnp then counts reads).
cell_tag: CB
umi_tag: UB

cellsnp:
  min_maf: 0.10
  min_count: 20

vireo:
  genotype_tag: GT
  n_donors: 36

# --- Stage 4: cell type annotation (targets: celltype, celltype_test) ---------
# Input is splitpipe/combined/<cell_meta dir>/count_matrix.mtx plus the demux
# table; output goes to <results_dir>/celltype/ (celltype_test/ for the smoke
# test). Three stages: prep -> doublets (one job per sublibrary) -> cluster.
# See workflow/rules/celltype.smk.
celltype:
  # R runs inside this image via `singularity exec` (conda-forge's current R
  # builds need glibc >= 2.28, newer than the cluster's).
  #   singularity pull seurat.sif docker://satijalab/seurat:latest
  # It supplies R 4.5.2, Seurat 5.5.1, harmony 2.0.5.
  container: /SAN/vyplab/alb_projects/tools/seurat.sif
  # Extra R library, searched before the image's own. Holds what the image
  # lacks: Azimuth (+ BSgenome / TFBSTools / Signac ...), humancortexref,
  # scDblFinder, RhpcBLASctl. Installed from inside the image with
  #   singularity exec --cleanenv -B /SAN --env R_LIBS=<this dir> seurat.sif Rscript ...
  r_libs: /SAN/vyplab/alb_projects/tools/R_celltype_lib
  # Host paths mounted into the container: inputs, outputs, script, r_libs.
  binds: [/SAN]
  seed: 42
  # true: only cells with a donor go into clustering (Harmony corrects on
  # donor_id, and "unassigned" is a mix of donors, not a batch). QC and doublet
  # calls are still made for, and reported on, every cell.
  only_assigned: true
  # Cells sampled for the celltype_test smoke test.
  test_n_cells: 20000

  # split-pipe has already filtered cells, so this is a light trim. For
  # reference, across all 426k cells: genes < 200 = 0.6%, genes > 10000 = 0.6%,
  # transcripts < 300 = 1.0%. Transcripts reach 2.7M at the very top, hence a
  # hard ceiling -- per-sublibrary MAD bounds are useless on a distribution this
  # wide (5 MADs lands at ~1M).
  qc:
    min_genes: 200
    max_genes: 10000
    min_counts: 300          # transcripts (UMIs)
    max_counts: 100000       # ~99.8th percentile; null = no ceiling
    max_pct_mt: 5            # nuclei: mito reads should be near zero
    min_cells_per_gene: 3

  # scDblFinder, run per sublibrary. Its built-in rate (0.8% per 1000 cells) is
  # a 10x figure and would call ~20% of each sublibrary here. For Parse the
  # rate is the barcode collision rate within a sublibrary:
  #   1 - exp(-cells_loaded / 96^3)
  # which is ~3% for the 26k cells recovered and ~7% if ~60k were loaded per
  # sublibrary. dbr_sd lets scDblFinder move within that range.
  doublets:
    dbr: 0.05
    dbr_sd: 0.03
    remove: true

  clustering:
    n_hvg: 2000
    n_pcs: 30
    # Batch variables. The FANS sort (`sample`) is left out on purpose: TDP-43-
    # negative nuclei may really differ, and that should survive correction.
    # If the report's R^2 page shows sublibrary structure surviving, add it.
    harmony_vars: [donor_id]
    resolution: 0.5          # -> seurat_clusters
    extra_resolutions: [0.2, 1.0]   # extra RNA_snn_res.* columns in the CSV

  azimuth:
    run: true
    # A SeuratData name (installed in the env) or a directory holding an
    # Azimuth reference (ref.Rds + idx.annoy).
    reference: humancortexref
    # Sublibraries mapped at once (capped at the job's slots). Each worker is a
    # separate R process holding one ~26k-cell query plus the reference,
    # ~10 GB, on top of the main process's ~90-100 GB -- 2 fits the 128 GB
    # celltype_cluster reservation.
    workers: 2

  # Ambient RNA (workflow/rules/soupx.smk). Step 1, soup_profile, sums the
  # empty barcodes of each sort's split-pipe DGE_unfiltered.
  soupx:
    # Empty barcodes: not an all-sample called cell, and UMIs (tscp_count) in
    # this closed range; check the shaded band on soup_report.pdf's rank plot.
    # The lower bound drops 1-9 UMI barcodes, which are mostly barcode errors.
    #
    # Per sort, because the background level is. The negative sorts spread a
    # few thousand cells per sublibrary over 43 wells (396k barcodes) and sit
    # at ~40-50 UMIs per empty barcode. `positive` packs ~20k cells per
    # sublibrary into 10 wells (92k barcodes): its background plateau runs
    # ~100-1000 UMIs, so [10, 100] caught only its low tail. 500 keeps a margin
    # below the knee where the called cells start.
    empty_umi_range:
      default: [10, 100]
      positive: [10, 500]
    # Rows in top_soup_genes.tsv, the list to choose rho marker sets from.
    n_top_genes: 200

    # --- soupx_rho / soupx_adjust ---
    # Cluster + cell-type labels: a FROZEN copy of a finished run's
    # cell_annotations.csv, at <results_dir>/<run>/<labels_file>. No rule
    # makes it; copy it in by hand, e.g.
    #   cp celltype/cell_annotations.csv celltype/first_pass_annotations.csv
    labels_file: first_pass_annotations.csv
    # Genes no glial nucleus should express, all well represented in the soup
    # (top_soup_genes.tsv). RBFOX3 is left out on purpose: whether K_negative
    # microglia carry NeuN is one of the questions, and using it here would
    # assume the answer.
    marker_sets:
      neuronal: [SYT1, SNAP25, RALYL, MYT1L, STXBP5L, CACNA1B, SYN3]
    # rho is estimated on cells of these predicted.class values...
    estimate_class: [Non-Neuronal]
    # ...minus these predicted.subclass values: OPCs express some of the
    # synaptic markers (54-77% exceeded the soup expectation).
    exclude_subclasses: [OPC]
    # Azimuth predicted.subclass.score below this -> not used for rho.
    min_label_score: 0.8
    # Candidate cells per sort (a random sample above this).
    max_cells: 50000
    # Fewer cells than this after SoupX's per-cluster exclusion -> fall back
    # to per-cell exclusion (clusters = FALSE). Both are always reported.
    min_est_cells: 500
    # null: use soupx_rho's estimates. Or override per sort, e.g.
    #   rho: {K_negative: 0.05, TDP_negative: 0.04, positive: 0.12}
    rho: null

  # Alternative doublet arm (workflow/rules/doublets_by_sort.smk), run beside
  # celltype.doublets, not instead of it. Two nuclei can only collide if they
  # share a round-1 well, so each sort has its own barcode space
  # (its round-1 wells x barcodes_per_r1_well) and its own collision rate.
  # Within each sublibrary, scDblFinder runs once per sort with
  #   lambda = -ln(1 - called_barcodes / space)       (occupancy)
  #   dbr    = 1 - lambda e^-lambda / (1 - e^-lambda) (share of barcodes with >1 nucleus)
  # counted from ALL split-pipe called barcodes of that sort, before QC.
  # Nuclei that were loaded but never called push the true rate a little
  # higher; dbr_sd_rel gives scDblFinder room around it.
  doublets_by_sort:
    barcodes_per_r1_well: 9216     # 96 round-2 x 96 round-3 wells (WT_mega)
    dbr_sd_rel: 0.3                # dbr.sd = dbr_sd_rel * dbr
    min_cells: 200                 # per sort per sublibrary; fewer -> left uncalled

# --- Contig naming ------------------------------------------------------------
# Only relevant to the vireo branch: applied when building the genotype panel,
# to make its contigs match the BAM. With the GENCODE reference above the BAM is
# chr-prefixed; GSA-imputed VCFs are usually 1..22. old<TAB>new per line.
rename_chrs: null   # e.g. config/chr_rename.txt

# --- Resources ---------------------------------------------------------------
# Per-rule thread counts. These MUST match the "-pe smp N" slot counts in
# config/cluster.yaml: SGE reserves memory per slot, so a rule that asks
# snakemake for more threads than it reserved slots will either be throttled or
# killed for overrunning its reservation.
threads:
  # Rules not listed here declare no `threads:` and get 1 slot.
  default: 1
  mkref: 4
  # The three-step split (splitpipe.split_steps: true). Measured mean core use
  # at 4 threads was pre 2.77, align 3.87, post-onward 1.2-1.9 -- so only the
  # first two are worth widening.
  split_pipe_pre: 8
  split_pipe_align: 8
  split_pipe_post: 4
  # Used only when splitpipe.split_steps is false.
  split_pipe: 4
  split_pipe_comb: 8
  prepare_reference_vcf: 4
  cellsnp: 8
  vireo: 4
  # Cell typing (workflow/rules/celltype.smk). Each must equal its -pe smp in
  # cluster.yaml. Doublet jobs are shared by the full run and the test.
  celltype_prep: 2
  celltype_prep_test: 2
  celltype_doublets: 2
  celltype_cluster: 4
  celltype_cluster_test: 2
  celltype_doublets_by_sort: 2
  doublets_compare: 1
  soup_profile: 1
  soupx_rho: 1
  soupx_adjust: 1
